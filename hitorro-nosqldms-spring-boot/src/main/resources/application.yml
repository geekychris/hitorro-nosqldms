server:
  port: 8090

spring:
  application:
    name: hitorro-dms
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 128MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

dms:
  home: ${user.home}/.hitorro/dms
  lucene-enabled: true
