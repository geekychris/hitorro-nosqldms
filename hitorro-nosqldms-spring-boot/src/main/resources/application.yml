server:
  port: 8090

spring:
  application:
    name: hitorro-dms
  http:
    converters:
      # Boot 4 defaults to Jackson 3; keep Jackson 2 (com.fasterxml.jackson) for HTTP.
      preferred-json-mapper: jackson2
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 128MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

dms:
  home: ${user.home}/.hitorro/dms
  lucene-enabled: true
